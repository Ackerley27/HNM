services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hospital_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-hospital_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hospital_monitor} -d ${POSTGRES_DB:-hospital_monitor}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hospital_monitor}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hospital_monitor}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-20}
      MONITORING_MODE: ${MONITORING_MODE:-demo}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost"]}
      COLLECTOR_INTERVAL_SECONDS: ${COLLECTOR_INTERVAL_SECONDS:-60}
    expose:
      - "8000"
    ports:
      - "${NETFLOW_V5_PORT:-2055}:${NETFLOW_V5_PORT:-2055}/udp"
      - "${SYSLOG_PORT:-5514}:${SYSLOG_PORT:-5514}/udp"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
